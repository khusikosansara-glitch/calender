      <stop offset="100%" style="stop-color:#fed6e3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 캘린더 아이콘 -->
  <rect x="5" y="10" width="40" height="40" rx="8" fill="url(#iconGradient)"/>
  <rect x="12" y="16" width="26" height="4" rx="2" fill="white" opacity="0.9"/>
  
  <!-- 날짜 점들 -->
  <circle cx="15" cy="27" r="2.5" fill="white" opacity="0.6"/>
  <circle cx="21" cy="27" r="2.5" fill="white" opacity="0.6"/>
  <circle cx="27" cy="27" r="2.5" fill="white" opacity="0.6"/>
  <circle cx="33" cy="27" r="2.5" fill="white" opacity="0.6"/>
  
  <circle cx="15" cy="34" r="2.5" fill="white" opacity="0.6"/>
  <circle cx="21" cy="34" r="2.5" fill="#fed6e3"/>
  <circle cx="27" cy="34" r="2.5" fill="white" opacity="0.6"/>
  <circle cx="33" cy="34" r="2.5" fill="white" opacity="0.6"/>
  
  <circle cx="15" cy="41" r="2.5" fill="white" opacity="0.6"/>
